<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>可交互的3D星空</title>
  <style>
    * { margin: 0; padding: 0; overflow: hidden; background: black; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    let w, h;
    let stars = [];
    let angleX = 0;   // 绕X轴旋转角度（上下拖）
    let angleY = 0;   // 绕Y轴旋转角度（左右拖）
    let zoom = 300;   // 视角远近
    
    // 鼠标交互变量
    let isDragging = false;
    let lastMouseX, lastMouseY;
    
    function resize() {
      w = canvas.width = innerWidth;
      h = canvas.height = innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    
    // 生成 500 颗星星的 3D 坐标 (x, y, z)
    for (let i = 0; i < 500; i++) {
      stars.push({
        x: (Math.random() - 0.5) * 600,
        y: (Math.random() - 0.5) * 600,
        z: (Math.random() - 0.5) * 600
      });
    }
    
    // 3D 旋转函数：绕 X 轴和 Y 轴旋转
    function rotateX(p, angle) {
      const cos = Math.cos(angle), sin = Math.sin(angle);
      return {
        x: p.x,
        y: p.y * cos - p.z * sin,
        z: p.y * sin + p.z * cos
      };
    }
    function rotateY(p, angle) {
      const cos = Math.cos(angle), sin = Math.sin(angle);
      return {
        x: p.x * cos + p.z * sin,
        y: p.y,
        z: -p.x * sin + p.z * cos
      };
    }
    
    // 绘制一帧
    function draw() {
      ctx.clearRect(0, 0, w, h);
      
      for (let s of stars) {
        // 应用旋转
        let p = rotateX(s, angleX);
        p = rotateY(p, angleY);
        
        // 透视投影
        const scale = zoom / (zoom + p.z);
        const sx = w / 2 + p.x * scale;
        const sy = h / 2 + p.y * scale;
        const r = Math.max(0.5, scale * 2);
        
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        // 根据深度改变亮度和颜色
        const brightness = Math.max(0.3, scale);
        ctx.fillStyle = `rgba(255,255,255,${brightness})`;
        ctx.fill();
      }
      
      requestAnimationFrame(draw);
    }
    
    // --- 鼠标交互事件 ---
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    
    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      angleY += dx * 0.005;  // 左右拖动 → 绕Y轴旋转
      angleX += dy * 0.005;  // 上下拖动 → 绕X轴旋转
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    
    window.addEventListener('mouseup', () => {
      isDragging = false;
    });
    
    // 滚轮缩放
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom += e.deltaY * 0.5;
      zoom = Math.max(100, Math.min(800, zoom)); // 限制缩放范围
    });
    
    // --- 手机触屏交互 ---
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (e.touches.length === 1) {
        isDragging = true;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (!isDragging || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - lastMouseX;
      const dy = e.touches[0].clientY - lastMouseY;
      angleY += dx * 0.005;
      angleX += dy * 0.005;
      lastMouseX = e.touches[0].clientX;
      lastMouseY = e.touches[0].clientY;
    });
    
    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      isDragging = false;
    });
    
    // 启动动画
    draw();
  </script>
</body>
</html>
