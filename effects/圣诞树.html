<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星星圣诞树</title>
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;

// ============ 配置 ============
const STAR_COUNT=1200;       // 星星总数
const FOV=600;               // 透视视野
const ROT_SPEED=0.005;       // 旋转灵敏度
const INERTIA=0.94;          // 惯性衰减
const SPREAD_SPEED=0.1;      // 展开/聚合动画速度

// 状态
let stars=[];
let angleY=0.35;             // 初始角度
let spread=0;                // 0=圣诞树, 1=散开星空
let targetSpread=0;          // 目标状态
let velY=0;
let dragging=false;
let lastMX=0,lastMY=0;
let pinchStart=0;

// ============ 窗口大小 ============
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();window.addEventListener('resize',resize);

// ============ 圣诞树形状函数 ============
// 树干在底部(y>0,屏幕下方), 树顶在上方(y<0,屏幕上方)
// 树高约760单位, 在FOV=600下约占屏幕75-80%
function treeRadius(y){
  // 树干（底部, 170单位高, 较窄）
  if(y>=180&&y<=350) return 22;
  // 树干上方缝隙
  if(y>=150&&y<180) return 0;
  // 第1层枝叶（最宽, 底部, 130单位高）
  if(y>=20&&y<150) return 200-(150-y)*60/130;
  // 层间缝隙
  if(y>=-10&&y<20) return 0;
  // 第2层枝叶（120单位高）
  if(y>=-130&&y<-10) return 155-(-10-y)*55/120;
  // 层间缝隙
  if(y>=-160&&y<-130) return 0;
  // 第3层枝叶（120单位高）
  if(y>=-280&&y<-160) return 115-(-160-y)*45/120;
  // 层间缝隙
  if(y>=-310&&y<-280) return 0;
  // 第4层枝叶（最窄, 顶部, 100单位高）
  if(y>=-410&&y<-310) return 75-(-310-y)*40/100;
  return 0;
}

function isTrunk(y){return y>=180&&y<=350;}

// ============ 生成星星 ============
function createStar(){
  let tx,ty,tz;
  for(let a=0;a<300;a++){
    ty=-480+Math.random()*830; // 覆盖树全高
    const r=treeRadius(ty);
    if(r<=0) continue;
    // 偏向表面分布，让树形轮廓清晰
    const dist=r*Math.pow(Math.random(),0.35);
    const angle=Math.random()*Math.PI*2;
    tx=Math.cos(angle)*dist;
    tz=Math.sin(angle)*dist; // 圆形截面
    break;
  }

  let color;
  if(isTrunk(ty)){
    const v=200+Math.floor(Math.random()*55);
    color=`rgb(${v},${v},${v})`;
  }else{
    const g=130+Math.floor(Math.random()*125);
    color=`rgb(${Math.floor(Math.random()*20)},${g},${Math.floor(Math.random()*30)})`;
  }

  // 散开位置（球体）
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const radius=300+Math.random()*400;
  const rx=radius*Math.sin(phi)*Math.cos(theta);
  const ry=radius*Math.sin(phi)*Math.sin(theta);
  const rz=radius*Math.cos(phi);

  return{tx,ty,tz,rx,ry,rz,color,size:2.0};
}

// 树顶五角星
function createTopStar(){
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const radius=300+Math.random()*400;
  return{
    tx:0,ty:-480,tz:0,
    rx:radius*Math.sin(phi)*Math.cos(theta),
    ry:radius*Math.sin(phi)*Math.sin(theta),
    rz:radius*Math.cos(phi),
    color:'#ffd700',
    size:2.0,
    isTopStar:true
  };
}

// ============ 初始化 ============
function initStars(){
  stars=[];
  for(let i=0;i<STAR_COUNT;i++) stars.push(createStar());
  stars.push(createTopStar());
}
initStars();

// ============ 透视投影 ============
function project(px,py,pz){
  const scale=FOV/(FOV+pz);
  return{sx:px*scale+W/2,sy:py*scale+H/2,scale,z:pz};
}

// ============ 绘制普通星星 ============
function drawStar(sx,sy,r,color,alpha){
  ctx.beginPath();ctx.arc(sx,sy,r*3,0,Math.PI*2);
  ctx.fillStyle=color.replace('rgb','rgba').replace(')',`,${alpha*0.12})`);
  ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r*1.5,0,Math.PI*2);
  ctx.fillStyle=color.replace('rgb','rgba').replace(')',`,${alpha*0.35})`);
  ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r*0.5,0,Math.PI*2);
  ctx.fillStyle=color.replace('rgb','rgba').replace(')',`,${alpha})`);
  ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,r*0.2,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,255,255,${alpha*0.9})`;
  ctx.fill();
}

// ============ 绘制树顶五角星 ============
function drawTopStar(sx,sy,r,alpha){
  ctx.save();ctx.translate(sx,sy);
  ctx.shadowColor='#ffd700';ctx.shadowBlur=r*10;
  const spikes=5,outerR=r*3,innerR=r*1.5;
  ctx.fillStyle='#ffd700';ctx.globalAlpha=alpha;ctx.beginPath();
  for(let i=0;i<spikes*2;i++){
    const rad=i*Math.PI/spikes-Math.PI/2;
    const ri=i%2===0?outerR:innerR;
    if(i===0)ctx.moveTo(Math.cos(rad)*ri,Math.sin(rad)*ri);
    else ctx.lineTo(Math.cos(rad)*ri,Math.sin(rad)*ri);
  }
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();
  ctx.arc(0,0,r*0.8,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

// ============ 渲染 ============
function render(){
  // 动画过渡
  spread+=(targetSpread-spread)*SPREAD_SPEED;
  if(Math.abs(targetSpread-spread)<0.001) spread=targetSpread;

  ctx.clearRect(0,0,W,H);

  const bgGrad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.6);
  bgGrad.addColorStop(0,spread>0.3?'rgba(10,15,25,0.3)':'rgba(10,25,10,0.3)');
  bgGrad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,W,H);

  const renderList=[];
  const cosY=Math.cos(angleY),sinY=Math.sin(angleY);

  for(let s of stars){
    const x=s.tx+(s.rx-s.tx)*spread;
    const y=s.ty+(s.ry-s.ty)*spread;
    const z=s.tz+(s.rz-s.tz)*spread;

    const rx=x*cosY+z*sinY;
    const rz=-x*sinY+z*cosY;

    if(rz<=-FOV+10) continue;

    const p=project(rx,y,rz);
    const alpha=Math.min(1,p.scale*1.2);
    const r=s.size*p.scale*2;

    renderList.push({sx:p.sx,sy:p.sy,r,alpha,color:s.color,z:rz,isTopStar:s.isTopStar});
  }

  renderList.sort((a,b)=>b.z-a.z);

  for(let item of renderList){
    if(item.isTopStar&&spread<0.5){
      drawTopStar(item.sx,item.sy,item.r,item.alpha);
    }else{
      drawStar(item.sx,item.sy,item.r,item.color,item.alpha);
    }
  }
}

// ============ 事件处理 ============
canvas.addEventListener('mousedown',e=>{
  dragging=true;lastMX=e.clientX;lastMY=e.clientY;velY=0;
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastMX;
  angleY+=dx*ROT_SPEED;velY=dx*ROT_SPEED;
  lastMX=e.clientX;lastMY=e.clientY;
});
window.addEventListener('mouseup',()=>{dragging=false;});

// 滚轮：触发动画切换
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.deltaY<0) targetSpread=1; // 向上滚→展开
  else targetSpread=0;           // 向下滚→聚合
},{passive:false});

// 触摸事件
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(e.touches.length===1){
    dragging=true;lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;velY=0;
  }else if(e.touches.length===2){
    dragging=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStart=Math.sqrt(dx*dx+dy*dy);
  }
});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dragging){
    const dx=e.touches[0].clientX-lastMX;
    angleY+=dx*ROT_SPEED;velY=dx*ROT_SPEED;
    lastMX=e.touches[0].clientX;lastMY=e.touches[0].clientY;
  }else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(pinchStart>0){
      if(dist>pinchStart*1.2) targetSpread=1;      // 放大→展开
      else if(dist<pinchStart*0.8) targetSpread=0;  // 缩小→聚合
    }
  }
});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();dragging=false;pinchStart=0;
});

// ============ 动画循环 ============
function loop(){
  if(!dragging){velY*=INERTIA;angleY+=velY;}
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
