<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>爱心对话框</title>
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:image" content="">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  font-family:"KaiTi","楷体","Microsoft YaHei",sans-serif;
}
/* 页面容器 */
.page{
  position:fixed;inset:0;width:100%;height:100%;
  transition:opacity 0.5s ease;
}
.page.hidden{opacity:0;pointer-events:none}
.page.active{opacity:1;pointer-events:auto}
/* 背景图片 */
.bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  background-repeat:no-repeat;
}
/* 粒子Canvas */
#particles{
  position:absolute;inset:0;pointer-events:none;z-index:2;
}
/* 对话框容器 */
.dialog-container{
  position:absolute;inset:0;z-index:3;pointer-events:none;
}
.dialog-container>*{pointer-events:auto}
/* 爱心对话框 */
.heart-dialog{
  position:absolute;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.3s ease,filter 0.3s ease;
}
.heart-dialog:hover{transform:scale(1.1);filter:brightness(1.2)}
.heart-dialog:active{transform:scale(0.95)}
.heart-dialog .heart{
  position:relative;width:90px;height:90px;
  display:flex;align-items:center;justify-content:center;
}
.heart-dialog .heart svg{
  position:absolute;top:0;left:0;width:100%;height:100%;
}
.heart-dialog .heart-text{
  position:relative;z-index:1;color:#fff;
  font-size:28px;font-weight:700;text-shadow:0 0 10px rgba(255,80,120,0.8);
  margin-top:2px;
}
/* 爱心发光 */
.heart-glow{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,60,100,0.3) 0%,rgba(255,60,100,0) 70%);
  animation:heartPulseGlow 2s ease-in-out infinite;
}
@keyframes heartPulseGlow{
  0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.6}
  50%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
}
/* 四角定位 */
.dialog-tl{top:30px;left:30px}
.dialog-tr{top:30px;right:30px}
.dialog-bl{bottom:30px;left:30px}
.dialog-br{bottom:30px;right:30px}
/* 返回按钮 */
.dialog-back{
  position:absolute;bottom:30px;right:30px;z-index:3;
  cursor:pointer;pointer-events:auto;
  background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.3);
  border-radius:25px;padding:12px 28px;color:#fff;font-size:16px;
  backdrop-filter:blur(8px);transition:all 0.3s;
  text-shadow:0 0 8px rgba(255,255,255,0.5);
}
.dialog-back:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.5)}
.dialog-back:active{transform:scale(0.95)}
/* 购买提示栏 */
#buy-bar{
  position:fixed;left:0;bottom:0;width:100%;height:42px;z-index:10;
  background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);
  border-top:1px solid rgba(255,255,255,0.15);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.7);font-size:13px;
}
#buy-bar a{
  color:#ffe066;margin-left:6px;text-decoration:none;font-weight:600;
}
/* 移动端适配 */
@media(max-width:480px){
  .heart-dialog .heart{width:70px;height:70px}
  .heart-dialog .heart-text{font-size:22px}
  .heart-glow{width:85px;height:85px}
  .dialog-tl{top:20px;left:20px}
  .dialog-tr{top:20px;right:20px}
  .dialog-bl{bottom:20px;left:20px}
  .dialog-br{bottom:20px;right:20px}
  .dialog-back{bottom:20px;right:20px;padding:10px 22px;font-size:14px}
  #buy-bar{height:38px;font-size:12px}
}
</style>
</head>
<body>
<!-- 首页 -->
<div class="page active" id="page-home">
  <div class="bg" style="background-image:url(https://www.wuwutech.top/images/a.jpg)"></div>

  <!-- 四个爱心对话框 -->
  <div class="dialog-container">
    <div class="heart-dialog dialog-tl" data-dialog="1">
      <div class="heart-glow"></div>
      <div class="heart">
        <svg viewBox="0 0 100 100"><path d="M50 88 C20 65 5 50 5 32 C5 18 16 5 30 5 C38 5 45 10 50 17 C55 10 62 5 70 5 C84 5 95 18 95 32 C95 50 80 65 50 88Z" fill="url(#hg1)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/><defs><radialGradient id="hg1" cx="40%" cy="30%"><stop offset="0%" stop-color="#ff6b8a"/><stop offset="100%" stop-color="#cc0033"/></radialGradient></defs></svg>
        <span class="heart-text">1</span>
      </div>
    </div>
    <div class="heart-dialog dialog-tr" data-dialog="2">
      <div class="heart-glow"></div>
      <div class="heart">
        <svg viewBox="0 0 100 100"><path d="M50 88 C20 65 5 50 5 32 C5 18 16 5 30 5 C38 5 45 10 50 17 C55 10 62 5 70 5 C84 5 95 18 95 32 C95 50 80 65 50 88Z" fill="url(#hg2)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/><defs><radialGradient id="hg2" cx="40%" cy="30%"><stop offset="0%" stop-color="#ff8a6b"/><stop offset="100%" stop-color="#cc3300"/></radialGradient></defs></svg>
        <span class="heart-text">2</span>
      </div>
    </div>
    <div class="heart-dialog dialog-bl" data-dialog="3">
      <div class="heart-glow"></div>
      <div class="heart">
        <svg viewBox="0 0 100 100"><path d="M50 88 C20 65 5 50 5 32 C5 18 16 5 30 5 C38 5 45 10 50 17 C55 10 62 5 70 5 C84 5 95 18 95 32 C95 50 80 65 50 88Z" fill="url(#hg3)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/><defs><radialGradient id="hg3" cx="40%" cy="30%"><stop offset="0%" stop-color="#ff6bc8"/><stop offset="100%" stop-color="#cc0088"/></radialGradient></defs></svg>
        <span class="heart-text">3</span>
      </div>
    </div>
    <div class="heart-dialog dialog-br" data-dialog="4">
      <div class="heart-glow"></div>
      <div class="heart">
        <svg viewBox="0 0 100 100"><path d="M50 88 C20 65 5 50 5 32 C5 18 16 5 30 5 C38 5 45 10 50 17 C55 10 62 5 70 5 C84 5 95 18 95 32 C95 50 80 65 50 88Z" fill="url(#hg4)" stroke="rgba(255,255,255,0.5)" stroke-width="2"/><defs><radialGradient id="hg4" cx="40%" cy="30%"><stop offset="0%" stop-color="#b86bff"/><stop offset="100%" stop-color="#6600cc"/></radialGradient></defs></svg>
        <span class="heart-text">4</span>
      </div>
    </div>
  </div>
</div>

<!-- 第二页（图片B） -->
<div class="page hidden" id="page-detail">
  <div class="bg" style="background-image:url(https://www.wuwutech.top/images/b.jpg)"></div>

  <!-- 右下角返回按钮 -->
  <div class="dialog-back" id="btn-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回
  </div>
</div>

<!-- 粒子Canvas -->
<canvas id="particles"></canvas>

<!-- 购买提示栏 -->
<div id="buy-bar">更多精美特效 <a href="#">点击购买</a></div>

<script>
// ============ 页面切换 ============
const pageHome=document.getElementById('page-home');
const pageDetail=document.getElementById('page-detail');
const btnBack=document.getElementById('btn-back');

// 音乐
let audioHome=null;
let audioDetail=null;
let audioStarted=false;

function initAudio(){
  if(audioStarted)return;
  audioHome=new Audio('https://www.wuwutech.top/audio/活力.mp3');
  audioHome.loop=true;
  audioHome.volume=0.5;
  audioDetail=new Audio('https://www.wuwutech.top/audio/爱情是苍天.mp3');
  audioDetail.loop=true;
  audioDetail.volume=0.5;
  audioStarted=true;
  audioHome.play().catch(()=>{});
}

function switchToDetail(){
  pageHome.classList.add('hidden');
  pageHome.classList.remove('active');
  pageDetail.classList.add('active');
  pageDetail.classList.remove('hidden');
  if(audioHome){audioHome.pause();audioHome.currentTime=0}
  if(audioDetail){audioDetail.play().catch(()=>{})}
  // 加点粒子爆发
  burstParticles();
}

function switchToHome(){
  pageDetail.classList.add('hidden');
  pageDetail.classList.remove('active');
  pageHome.classList.add('active');
  pageHome.classList.remove('hidden');
  if(audioDetail){audioDetail.pause();audioDetail.currentTime=0}
  if(audioHome){audioHome.play().catch(()=>{})}
  burstParticles();
}

// 点击爱心对话框1 → 跳转
document.querySelectorAll('.heart-dialog[data-dialog="1"]').forEach(el=>{
  el.addEventListener('click',()=>{initAudio();switchToDetail()});
  el.addEventListener('touchend',e=>{e.preventDefault();initAudio();switchToDetail()});
});

// 返回按钮
btnBack.addEventListener('click',switchToHome);
btnBack.addEventListener('touchend',e=>{e.preventDefault();switchToHome();});

// 首次点击任意位置初始化音频
document.addEventListener('click',initAudio,{once:true});
document.addEventListener('touchend',initAudio,{once:true});

// ============ 粒子系统 ============
const pCanvas=document.getElementById('particles');
const pCtx=pCanvas.getContext('2d');
let pW,pH;
function pResize(){pW=pCanvas.width=window.innerWidth;pH=pCanvas.height=window.innerHeight}
pResize();window.addEventListener('resize',pResize);

const particles=[];
const MAX_PARTICLES=120;

function createParticle(x,y,color){
  return{
    x,y,
    vx:(Math.random()-0.5)*3,
    vy:(Math.random()-0.5)*3-2,
    life:1,
    decay:0.008+Math.random()*0.02,
    size:2+Math.random()*4,
    color:color||`hsl(${Math.random()*60+330},80%,${50+Math.random()*30}%)`
  };
}

function burstParticles(){
  const cx=pW/2,cy=pH/2;
  for(let i=0;i<40;i++){
    particles.push(createParticle(cx+rand(-100,100),cy+rand(-100,100)));
  }
}

function rand(a,b){return a+Math.random()*(b-a)}

// 点击爱心产生粒子
document.querySelectorAll('.heart-dialog').forEach(el=>{
  el.addEventListener('click',e=>{
    const rect=el.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    for(let i=0;i<15;i++){
      particles.push(createParticle(cx+rand(-20,20),cy+rand(-20,20)));
    }
  });
});

// 点击页面空白处产生粒子
document.addEventListener('click',e=>{
  if(e.target.closest('.heart-dialog')||e.target.closest('#btn-back'))return;
  for(let i=0;i<5;i++){
    particles.push(createParticle(e.clientX,e.clientY));
  }
});

// 渲染粒子
function renderParticles(){
  pCtx.clearRect(0,0,pW,pH);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.02;
    p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue}
    const alpha=p.life;
    pCtx.save();
    pCtx.globalAlpha=alpha;
    pCtx.fillStyle=p.color;
    pCtx.shadowColor=p.color;
    pCtx.shadowBlur=6*alpha;
    pCtx.beginPath();
    pCtx.arc(p.x,p.y,p.size*alpha,0,Math.PI*2);
    pCtx.fill();
    pCtx.restore();
  }
  requestAnimationFrame(renderParticles);
}
requestAnimationFrame(renderParticles);
</script>
</body>
</html>
