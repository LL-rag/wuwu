<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>四角对话框</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    /* 全屏背景图 */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('/images/a.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* 对话框通用样式 */
    .dialog {
      position: fixed;
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      line-height: 1;
      padding: 20px 24px;
      border-radius: 14px;
      cursor: pointer;
      min-width: 50px;
      backdrop-filter: blur(4px);       /* 轻微毛玻璃效果 */
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .dialog:hover {
      transform: scale(1.06);
      box-shadow: 0 0 18px rgba(255,255,255,0.25);
    }

    /* 四个角定位 */
    .dialog.tl { top: 20px; left: 20px; }
    .dialog.tr { top: 20px; right: 20px; }
    .dialog.bl { bottom: 20px; left: 20px; }
    .dialog.br { bottom: 20px; right: 20px; }

    /* 移动端调整 */
    @media (max-width: 600px) {
      .dialog {
        font-size: 22px;
        padding: 16px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景 -->
  <div class="bg"></div>

  <!-- 背景音乐（循环） -->
  <audio id="bgm" src="/audio/b.mp3" loop preload="auto"></audio>

  <!-- 四个数字对话框 -->
  <div class="dialog tl" onclick="handleTap(1)">1</div>
  <div class="dialog tr" onclick="handleTap(2)">2</div>
  <div class="dialog bl" onclick="handleTap(3)">3</div>
  <div class="dialog br" onclick="handleTap(4)">4</div>

  <script>
    const bgm = document.getElementById('bgm');

    // 尝试自动播放，如果被阻止则等待用户第一次交互后播放
    bgm.play().catch(() => {
      const playMusic = () => {
        bgm.play();
        document.removeEventListener('click', playMusic);
        document.removeEventListener('touchstart', playMusic);
      };
      document.addEventListener('click', playMusic);
      document.addEventListener('touchstart', playMusic);
    });

    // 对话框点击效果（可自定义，这里简单弹出数字）
    function handleTap(num) {
      alert('你点击了对话框 ' + num);
      // 如果想改成跳转或其他交互，替换这里即可
    }
  </script>
</body>
</html>
