  html, body {
    margin:0; padding:0; height:100%; background:#000308; overflow:hidden;

    -webkit-tap-highlight-color:transparent;
  }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#000308;
    touch-action:none;
  }
  /* CRT 扫描线 + 轻微 RGB 荫罩（静态，保证手机流畅） */
  #crt {
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, rgba(2,0,8,.32) 0px, rgba(2,0,8,.32) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(90deg, rgba(255,0,170,.035) 0px, rgba(0,240,255,.035) 1px, rgba(255,230,0,.02) 2px, transparent 3px);
  }
  /* 暗角 */

    position:fixed; inset:0; z-index:6; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(0,0,6,.55) 100%);
  }
  /* 竖屏时特效层与游戏画面一起旋转 */
  .rot90 {
    left:50% !important; top:50% !important;
    transform: translate(-50%,-50%) rotate(90deg);
  }

function computeSize() {
  const iw = innerWidth, ih = innerHeight;
  rotated = ih > iw;      /* 竖屏：画面整体旋转 90°，手机横过来拿即可 */
  const ratio = rotated ? ih / iw : iw / ih;
  W = Math.round(H * Math.min(2.25, Math.max(1.6, ratio)));
  FIRE_X = W - 60;
  canvas.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  if (rotated) {
    canvas.style.width  = ih + 'px';
    canvas.style.height = iw + 'px';
    canvas.style.transform = 'rotate(90deg)';
    canvas.style.transformOrigin = '50% 50%';
    for (const el of fxLayers) {
      el.classList.add('rot90');
      el.style.width  = ih + 'px';
      el.style.height = iw + 'px';
    }
  } else {
    canvas.style.transform = 'none';
    const s = Math.min(iw / W, ih / H);
    canvas.style.width  = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
    for (const el of fxLayers) {
      el.classList.remove('rot90');
      el.style.width = el.style.height = '';
    }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ================= 音效（Web Audio 合成） ================= */
let AC = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const len = AC.sampleRate | 0;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || muted) return;
  toneAt(type, f0, f1, dur, vol, AC.currentTime + delay);
}
function toneAt(type, f0, f1, dur, vol, at) {
  if (!AC || muted) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f0), at);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), at + dur);
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(at); o.stop(at + dur + 0.02);
}
function noise(dur, vol, f0, f1, delay = 0) {
  if (!AC || muted || !noiseBuf) return;
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter();
  fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(AC.destination);
  s.start(t); s.stop(t + dur + 0.05);
}
const S = {

  hit()    { tone('sawtooth', 420, 55, 0.42, 0.32); noise(0.3, 0.35, 1200, 80); },

/* ================= BGM（Web Audio 合成循环） ================= */
let bgmOn = false, bgmTimer = null, bgmStep = 0, bgmNext = 0;
const BASS = [55, 55, 65.41, 55, 49, 49, 58.27, 49];
const ARP  = [440, 523.25, 659.25, 587.33];
function startBGM() {
  if (!AC || bgmTimer) return;
  bgmOn = true; bgmStep = 0; bgmNext = AC.currentTime + 0.1;
  bgmTimer = setInterval(() => {
    if (!bgmOn || !AC) return;
    const sd = 0.227;    /* 132BPM 八分音符 */
    while (bgmNext < AC.currentTime + 0.35) {
      toneAt('triangle', BASS[bgmStep % 8], BASS[bgmStep % 8], sd * 1.7, 0.085, bgmNext);
      if (bgmStep % 2 === 0)
        toneAt('square', ARP[(bgmStep >> 1) % 4], ARP[(bgmStep >> 1) % 4], sd * 0.8, 0.035, bgmNext);
      bgmNext += sd; bgmStep++;
    }
  }, 120);
}
function stopBGM() {
  bgmOn = false;
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}

function textW(s, sc) {
  let w = 0;
  for (const ch of s) w += (ch === ' ' ? 4 : 6);
  return (w - 1) * sc;
}
function drawText(s, x, y, sc, color, align, glow) {
  if (align === 'center') x -= Math.round(textW(s, sc) / 2);
  if (align === 'right')  x -= textW(s, sc);
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = sc * 2; }
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of s) {
    if (ch === ' ') { cx += 4 * sc; continue; }
    const g = FONT[ch];
    if (!g) { cx += 6 * sc; continue; }
    for (let r = 0; r < 5; r++)
      for (let c = 0; c < 5; c++)
        if (g[r][c] === 'X') ctx.fillRect(cx + c * sc, y + r * sc, sc, sc);
    cx += 6 * sc;
  }
  ctx.restore();
}

/* ================= 中文像素风文字 ================= */
const _ctCache = new Map();
function drawCText(s, x, y, size, color, align, glow) {
  const key = s + '\u0001' + size + '\u0001' + color;
  let cv = _ctCache.get(key);
  if (!cv) {
    cv = document.createElement('canvas');
    const c2 = cv.getContext('2d');
    const F = 'bold 12px "PingFang SC","Microsoft YaHei","Heiti SC",sans-serif';
    c2.font = F; c2.textBaseline = 'top';
    const w = Math.ceil(c2.measureText(s).width) + 2;
    cv.width = w; cv.height = 16;
    c2.font = F; c2.textBaseline = 'top';
    c2.fillStyle = color;
    c2.fillText(s, 1, 1);
    if (_ctCache.size > 240) _ctCache.clear();
    _ctCache.set(key, cv);
  }
  const k = size / 12;
  const dw = cv.width * k, dh = cv.height * k;
  if (align === 'center') x -= dw / 2;
  if (align === 'right')  x -= dw;
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = Math.max(2, size * 0.7); }
  ctx.drawImage(cv, Math.round(x), Math.round(y), dw, dh);
  ctx.restore();
}

function drawSprite(map, x, y, px, pal) {
  pal = pal || PAL;
  for (let r = 0; r < map.length; r++) {
    const row = map[r];
    for (let c = 0; c < row.length; c++) {
      const col = pal[row[c]];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * px, y + r * px, px, px);
    }
  }
}

/* ================= 工具 ================= */
function aabb(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}
function shake(mag, t) { shakeMag = Math.max(shakeMag, mag); shakeT = Math.max(shakeT, t); }
function flash(col, t) { flashCol = col; flashT = Math.max(flashT, t); }
function addPop(x, y, txt, col) { pops.push({ x, y, txt, col, life: 0.9 }); }
function boomFx(x, y, n, big) {
  const cols = [COL.cy, COL.mg, COL.yl, COL.wh];
  if (parts.length > 110) n = Math.min(n, 12);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.29), sp = rnd(20, big ? 170 : 100);
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rnd(0.3, big ? 0.9 : 0.6), max: 1,
      col: cols[(Math.random() * 4) | 0], sz: big ? ((Math.random() * 3 + 2) | 0) : ((Math.random() * 2 + 1) | 0)
    });
  }
  parts.push({ x, y, vx: 0, vy: 0, life: 0.12, max: 1, col: COL.wh, sz: big ? 22 : 12 });
}
function dropPup(x, y, forced, chance) {
  const p = (chance !== undefined) ? chance : 0.28;
  if (!forced && Math.random() > p) return;
  const r = Math.random();
  const type = r < 0.38 ? 'power' : (r < 0.72 ? 'spread' : 'shield');
  pups.push({ x, y, vx: -26, vy: rnd(-14, 14), type, t: 0 });
}

/* ================= 波次 ================= */
function buildWave(i) {
  spawnT = 0; spawnQ = [];
  const R = (dailyMode && seedRng) ? drnd : rnd;   /* 每日挑战：固定序列 */
  if ((i + 1) % 4 === 0) {
    warnT = 2.6;
    S.warn();
    return;
  }
  /* 难度曲线：前 3 波密度 ×0.8，之后正常递增 */
  const n = Math.round((4 + Math.min(14, i * 2)) * (i < 3 ? 0.8 : 1));
  const m = i < 1 ? 0 : Math.min(4, Math.floor(i / 2));
  const q = [];
  for (let k = 0; k < n; k++)
    q.push({ t: 0.3 + k * 0.55 + R(0, 0.4), type: 'small', y: R(26, H - 56) });
  for (let j = 0; j < m; j++)
    q.push({ t: 1.5 + j * 4 + R(0, 1.2), type: 'med', y: R(34, H - 90) });
  /* 第 2 波起：自爆蜂群（成组冲锋） */
  if (i >= 1) {
    const groups = 1 + Math.min(2, Math.floor((i - 1) / 3));
    for (let g = 0; g < groups; g++) {
      const t0 = 2.2 + g * 5 + R(0, 1.5), gy = R(40, H - 70);
      const cnt = 4 + ((i / 2) | 0) % 3;
      for (let k = 0; k < cnt; k++)
        q.push({ t: t0 + k * 0.22, type: 'swarm', y: gy + R(-18, 18) });
    }
  }
  /* 第 4 波起：精英猎手（追踪导弹） */
  if (i >= 4) {
    const hn = 1 + ((i >= 8) ? 1 : 0);
    for (let h = 0; h < hn; h++)
      q.push({ t: 3 + h * 7 + R(0, 2), type: 'hunter', y: R(34, H - 90) });
  }
  q.sort((a, b) => a.t - b.t);
  spawnQ = q;
}
function spawnEnemy(type, y) {
  if (type === 'small')
    enemies.push({ type, x: W + 20, baseY: y, y, w: 24, h: 20, vx: -(78 + waveIdx * 6), hp: 1, ph: rnd(0, 6.28), pts: 10, flash: 0 });
  else if (type === 'med')
    enemies.push({ type, x: W + 24, baseY: y, y, w: 40, h: 30, vx: -30, hp: 6, fireT: rnd(0.8, 1.6), pts: 50, drift: rnd(6, 16), flash: 0 });
  else if (type === 'swarm')
    enemies.push({ type, x: W + 20, y, w: 16, h: 12, hp: 1, pts: 15, spd: 110 + waveIdx * 3, flash: 0 });
  else /* hunter 精英 */
    enemies.push({ type, x: W + 24, y, w: 24, h: 18, hp: 10, maxhp: 10, pts: 120, targetX: W - 60 - rnd(0, 30), fireT: 2.2, drift: rnd(10, 22), flash: 0, elite: true });
}
function spawnBoss() {
  /* 难度动态：Boss 血量随玩家火力微调，避免火力满级后变纸糊 */
  const hp = Math.round((160 + waveIdx * 30) * (1 + (power - 1) * 0.18));
  boss = { x: W + 60, y: H / 2 - 34, w: 100, h: 66, hp, maxhp: hp, phase: 1, t: 0, fireT: 1.4, entered: false, flash: 0, dying: 0, dieT: 0 };
  bossHurt = false;
}

/* ================= 必杀技 ================= */
function bombReady() { return energy >= 100; }
function useBomb() {
  if (!bombReady() || state !== 'playing') return;
  energy = 0;
  bombUsed++;
  stats.bombs++;
  if (stats.bombs >= 5) unlock('bomb5');
  saveStats();
  inv = Math.max(inv, 1.5);
  ebullets.length = 0;      /* 事件回调中调用，不在遍历中，安全 */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.hp -= 10; e.flash = 0.08;
    if (e.hp <= 0) e.dead = true;
  }
  if (boss && !boss.dying) {
    boss.hp -= 60; boss.flash = 0.2;
    if (boss.hp <= 0) {
      boss.dying = 1.5; boss.dieT = 0;
      score += Math.round(2000 * mult);
      scorePulse = 1;
    }
  }
  flash('255,255,255', 0.3);
  shake(8, 0.6);
  S.bomb();
  addPop(player.x + 40, player.y - 8, '必杀!', COL.wh);
}
let lastFireTap = 0;

/* ================= 开始 / 结束 ================= */
function startGame(daily) {
  dailyMode = !!daily;
  if (dailyMode) {
    seedRng = mulberry32(YMD);
    try { dailyBest = +(localStorage.getItem('sv_daily_' + YMD) || 0) || 0; } catch (e) {}
  }
  state = 'playing'; paused = false;
  score = 0; scoreShown = 0; scorePulse = 0; newRecord = false;
  lives = 3; combo = 0; comboT = 0; mult = 1;
  inv = 0; shieldT = 0; spreadT = 0; power = 1;
  shakeT = 0; shakeMag = 0; flashT = 0;
  waveIdx = 0; phase = 'announce'; interT = 1.6; waveTextT = 2.2; warnT = 0;
  bullets = []; ebullets = []; enemies = []; parts = []; pups = []; pops = [];
  boss = null; bossKills = 0; overT = 0;
  energy = 0; slowmoT = 0; grazeCnt = 0; bombUsed = 0; bossHurt = false; comboPeak = 0;
  player.x = 40; player.y = H / 2 - 10; player.cd = 0;
  startBGM();
}
function damagePlayer() {
  if (inv > 0 || shieldT > 0) return;
  lives--;
  combo = 0; mult = 1;
  boomFx(player.x + 14, player.y + 12, 22, false);
  S.hit(); shake(4, 0.35); flash('255,60,120', 0.15);
  if (boss && boss.entered) bossHurt = true;
  ebullets.length = 0;   /* 原地清空（不能替换数组） */
  if (lives <= 0) {
    state = 'over'; overT = 0;
    stopBGM();
    S.bigboom(); shake(10, 1.2); flash('255,255,255', 0.35);
    if (dailyMode) {
      if (score > dailyBest) {
        dailyBest = score;
        try { localStorage.setItem('sv_daily_' + YMD, String(dailyBest)); } catch (e) {}
      }
      unlock('daily');
    } else if (score > hi) {
      hi = score; newRecord = true;
      try { localStorage.setItem('stellar_vanguard_hi', String(hi)); } catch (e) {}
    }
  } else {
    inv = 2.5;
  }
}

/* ================= 输入 ================= */
const keys = {};
addEventListener('keydown', e => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  keys[e.code] = true;
  initAudio();
  if (e.code === 'KeyM') { muted = !muted; return; }
  if (state === 'title') {
    if (achOverlay) { achOverlay = false; return; }
    if (e.code === 'KeyV') { achOverlay = true; return; }
    if (e.code === 'KeyD') { startGame(true); return; }
    startGame(false); return;
  }
  if (state === 'over' && overT > 0.6 && e.code === 'KeyR') { startGame(dailyMode); return; }
  if (state === 'playing') {
    if (e.code === 'KeyP') paused = !paused;
    if (e.code === 'KeyB') useBomb();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousedown', () => {
  initAudio();
  if (state === 'title') { if (!achOverlay) startGame(false); else achOverlay = false; }
  else if (state === 'over' && overT > 0.8) startGame(dailyMode);
});

/* ================= 触屏控制 ================= */
const joy = { active: false, id: null, x: 0, y: 0 };
const fireTouch = new Set();
const JOY_R = 34, JOY_X = 64, JOY_Y = H - 60;
const FIRE_R = 30, FIRE_Y = H - 58;
function touchPos(t) {
  if (rotated) {
    return { x: t.clientY / innerHeight * W, y: (innerWidth - t.clientX) / innerWidth * H };
  }
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
}
function handleStart(e) {
  try {
    e.preventDefault();
    initAudio();
    for (const t of e.changedTouches) {
      const p = touchPos(t);
      if (state === 'title') {
        if (achOverlay) { achOverlay = false; return; }
        if (p.x < 80 && p.y < 60) { achOverlay = true; return; }            /* 左上角：成就 */
        if (p.x < W * 0.45 && p.y > H - 70) { startGame(true); return; }     /* 左下角：每日挑战 */
        startGame(false); return;
      }
      if (state === 'over')  { if (overT > 0.8) startGame(dailyMode); return; }
      if (p.x > W - 44 && p.y < 44) { paused = !paused; return; }            /* 右上角暂停键 */
      if (paused) { paused = false; return; }
      if (p.x < W * 0.5) {                /* 左半屏：摇杆 */
        joy.active = true; joy.id = t.identifier; joy.x = 0; joy.y = 0;
      } else {                             /* 右半屏：射击（双击=必杀） */
        const tNow = performance.now();
        if (tNow - lastFireTap < 280 && bombReady()) useBomb();
        lastFireTap = tNow;
        fireTouch.add(t.identifier);
      }
    }
  } catch (err) { console.error(err); }
}
function handleMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) {
      const dx = touchPos(t).x - JOY_X, dy = touchPos(t).y - JOY_Y;
      const d = Math.hypot(dx, dy) || 1;
      const cl = Math.min(d, JOY_R);
      joy.x = dx / d * (cl / JOY_R);
      joy.y = dy / d * (cl / JOY_R);
    }
  }
}
function handleEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy.active && t.identifier === joy.id) { joy.active = false; joy.x = 0; joy.y = 0; }
    fireTouch.delete(t.identifier);
  }
}
addEventListener('touchstart', handleStart, { passive: false });
addEventListener('touchmove',  handleMove,  { passive: false });
addEventListener('touchend',   handleEnd,   { passive: false });
addEventListener('touchcancel', handleEnd,  { passive: false });

/* ================= 玩家开火 ================= */
function fire() {
  player.cd = Math.max(0.09, 0.20 - (power - 1) * 0.035);
  const dmg = 1 + (power - 1) * 0.6;
  const sz = 2 + (power - 1);
  const angles = spreadT > 0 ? [-0.26, 0, 0.26] : [0];
  for (const a of angles)
    bullets.push({ x: player.x + 26, y: player.y + 11, vx: 340 * Math.cos(a), vy: 340 * Math.sin(a), dmg, sz });
  S.shoot();
}

/* ================= 更新 ================= */
function update(dt) {
  tGlobal += dt; frame++;
  const now = performance.now() / 1000;

  for (const s of stars) {
    s.x -= s.spd * dt;
    if (s.x < -3) { s.x = W + rnd(0, 20); s.y = rnd(0, H); }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].y -= 24 * dt; pops[i].life -= dt;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }
  if (achToast) { achToast.t -= dt; if (achToast.t <= 0) achToast = null; }
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeMag = 0; }
  if (flashT > 0) flashT -= dt;
  scoreShown += (score - scoreShown) * Math.min(1, dt * 12);
  if (scorePulse > 0) scorePulse -= dt * 3;

  if (state === 'title') {
    for (const s of titleShips) {
      s.x -= s.v * dt;
      if (s.x < -30) { s.x = W + rnd(10, 80); s.y = s.map === SHIP_PLAYER ? H - 34 : rnd(20, H - 40); }
    }
    return;
  }
  if (state === 'over') { overT += dt; return; }

  /* ---------- playing ---------- */
  if (combo > comboPeak) comboPeak = combo;
  if (waveTextT > 0) waveTextT -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; mult = 1; } }
  if (inv > 0) inv -= dt;
  if (shieldT > 0) shieldT -= dt;
  if (spreadT > 0) spreadT -= dt;

  /* 波次调度 */
  if (warnT > 0) {
    warnT -= dt;
    if (warnT <= 0) spawnBoss();
  } else if (phase === 'announce') {
    interT -= dt;
    if (interT <= 0) { phase = 'active'; buildWave(waveIdx); }
  } else if (phase === 'active' && !boss) {
    spawnT += dt;
    while (spawnQ.length && spawnQ[0].t <= spawnT) {
      const e = spawnQ.shift();
      spawnEnemy(e.type, e.y);
    }
    if (!spawnQ.length && enemies.length === 0) {
      waveIdx++;
      const bonus = Math.round(100 * (waveIdx) * mult);
      score += bonus;
      addPop(W / 2, H / 2, '+' + bonus, COL.yl);
      phase = 'announce'; interT = 1.8; waveTextT = 2.2;
    }
  }

  /* 玩家移动 */
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
  if (keys['ArrowUp'] || keys['KeyW']) dy -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
  if (joy.active) { dx = joy.x; dy = joy.y; }
  const mag = Math.hypot(dx, dy);
  if (mag > 1) { dx /= mag; dy /= mag; }
  player.x += dx * player.speed * dt;
  player.y += dy * player.speed * dt;
  player.x = Math.max(2, Math.min(W - 34, player.x));
  player.y = Math.max(4, Math.min(H - 28, player.y));
  player.cd -= dt;
  if ((keys['Space'] || fireTouch.size > 0) && player.cd <= 0) fire();

  /* 玩家子弹（含拦截追踪导弹） */
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x > W + 10 || b.y < -10 || b.y > H + 10) { bullets.splice(i, 1); continue; }
    let hit = false;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (aabb(b.x, b.y, b.sz + 2, 4, e.x + 3, e.y + 3, e.w - 6, e.h - 6)) {
        e.hp -= b.dmg; e.flash = 0.06; hit = true;      /* 击中白闪 */
        parts.push({ x: b.x, y: b.y, vx: rnd(-30, 10), vy: rnd(-40, 40), life: 0.2, max: 1, col: COL.yl, sz: 1 });
        if (e.hp <= 0) killEnemy(j);
        break;
      }
    }
    /* 拦截敌方追踪导弹 */
    if (!hit) {
      for (let j = ebullets.length - 1; j >= 0; j--) {
        const eb = ebullets[j];
        if (!eb.homing) continue;
        if (aabb(b.x, b.y, b.sz + 2, 4, eb.x - 4, eb.y - 4, 9, 9)) {
          ebullets.splice(j, 1);
          hit = true;
          score += 5;
          boomFx(eb.x, eb.y, 6, false);
          addPop(eb.x, eb.y - 6, '+5', COL.gn);
          break;
        }
      }
    }
    if (!hit && boss && !boss.dying && boss.entered &&
        aabb(b.x, b.y, b.sz + 2, 4, boss.x + 6, boss.y + 6, boss.w - 12, boss.h - 12)) {
      boss.hp -= b.dmg; boss.flash = 0.06; hit = true;
      parts.push({ x: b.x, y: b.y, vx: rnd(-40, 0), vy: rnd(-50, 50), life: 0.2, max: 1, col: COL.cy, sz: 1 });
      if (boss.hp <= 0) {
        boss.dying = 1.5; boss.dieT = 0;
        score += Math.round(2000 * mult);
        addPop(boss.x + boss.w / 2, boss.y, '+' + Math.round(2000 * mult), COL.yl);
        scorePulse = 1;
      }
    }
    if (hit) bullets.splice(i, 1);
  }

  /* 敌人 */
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.flash > 0) e.flash -= dt;
    if (e.type === 'small') {
      e.x += e.vx * dt;
      e.y = e.baseY + Math.sin(e.x * 0.02 + e.ph) * 26;
    } else if (e.type === 'med') {
      e.x += e.vx * dt;
      e.fireT -= dt;
      const ty = player.y + 10;
      e.y += Math.sign(ty - e.y) * e.drift * dt;
      if (e.fireT <= 0 && e.x < W - 10) {
        e.fireT = Math.max(0.9, 1.9 - waveIdx * 0.1);
        const px = player.x + 14, py = player.y + 12;
        const a = Math.atan2(py - (e.y + 14), px - (e.x + 2));
        ebullets.push({ x: e.x + 2, y: e.y + 13, vx: Math.cos(a) * 135, vy: Math.sin(a) * 135 });
        S.eshoot();
      }
    } else if (e.type === 'swarm') {
      /* 自爆蜂群：持续朝玩家冲锋 */
      const px = player.x + 12, py = player.y + 10;
      const a = Math.atan2(py - (e.y + 6), px - (e.x + 8));
      e.x += Math.cos(a) * e.spd * dt;
      e.y += Math.sin(a) * e.spd * dt;
    } else if (e.type === 'hunter') {
      /* 精英猎手：进场后垂直游走，发射追踪导弹 */
      if (e.x > e.targetX) e.x -= 70 * dt;
      else {
        e.fireT -= dt;
        const ty = player.y + 10;
        e.y += Math.sign(ty - e.y) * e.drift * dt;
        e.y = Math.max(30, Math.min(H - 50, e.y));
        if (e.fireT <= 0) {
          e.fireT = 2.4;
          ebullets.push({ x: e.x, y: e.y + 9, vx: -70, vy: 0, homing: true, hp: 1 });
          S.eshoot();
        }
      }
    }
    if (e.x < -50 || e.y < -40 || e.y > H + 40) { enemies.splice(i, 1); continue; }
    if (inv <= 0 && shieldT <= 0 && aabb(player.x + 5, player.y + 5, 18, 15, e.x + 3, e.y + 3, e.w - 6, e.h - 6)) {
      killEnemy(i, true);
      damagePlayer();
      break;
    }
  }
  /* 蜂群连锁爆炸清算（死亡标记 → 统一结算） */
  for (let i = enemies.length - 1; i >= 0; i--) {
    if (enemies[i].dead) { killEnemy(i, enemies[i].chainSilent); enemies[i].chainSilent = false; }
  }

  /* Boss */
  if (boss) {
    boss.flash -= dt;
    if (boss.dying > 0) {
      boss.dying -= dt; boss.dieT += dt;
      if (boss.dieT > 0.14) {
        boss.dieT = 0;
        boomFx(rnd(boss.x, boss.x + boss.w), rnd(boss.y, boss.y + boss.h), 18, true);
        S.boom(); shake(5, 0.25);
      }
      if (boss.dying <= 0) {
        boomFx(boss.x + boss.w / 2, boss.y + boss.h / 2, 70, true);
        S.bigboom(); shake(12, 1); flash('255,255,255', 0.4);
        slowmoT = 0.9;                                  /* Boss 击杀慢动作 */
        if (!bossHurt) unlock('noboss');
        stats.boss++;
        if (stats.boss >= 1) unlock('b1');
        if (stats.boss >= 3) unlock('b3');
        saveStats();
        dropPup(boss.x + 30, boss.y + 20, true);
        dropPup(boss.x + 60, boss.y + 40, true);
        boss = null; bossKills++;
        waveIdx++;
        phase = 'announce'; interT = 3; waveTextT = 2.4;
      }
    } else {
      if (!boss.entered) {
        boss.x -= 65 * dt;
        if (boss.x <= W - 130) { boss.x = W - 130; boss.entered = true; }
      } else {
        boss.t += dt;
        const ph = boss.hp > boss.maxhp * 0.66 ? 1 : (boss.hp > boss.maxhp * 0.33 ? 2 : 3);
        if (ph !== boss.phase) {
          boss.phase = ph; boss.flash = 0.3;
          S.phase(); shake(6, 0.4); flash('255,0,100', 0.25);
          for (let k = 0; k < 12; k++) {
            const a = k / 12 * 6.283;
            ebullets.push({ x: boss.x + 20, y: boss.y + boss.h / 2, vx: Math.cos(a) * 95, vy: Math.sin(a) * 95 });
          }
        }
        boss.y = H / 2 - boss.h / 2 + Math.sin(boss.t * (ph === 3 ? 1.5 : 0.75)) * 62;
        boss.fireT -= dt;
        const nx = boss.x + 8, ny = boss.y + boss.h / 2;
        if (boss.fireT <= 0) {
          if (ph === 1) {
            boss.fireT = 1.4;
            for (let k = -2; k <= 2; k++) {
              const a = Math.PI + k * 0.22;
              ebullets.push({ x: nx, y: ny, vx: Math.cos(a) * 115, vy: Math.sin(a) * 115 });
            }
            S.eshoot();
          } else if (ph === 2) {
            boss.fireT = 1.0;
            const pa = Math.atan2(player.y + 12 - ny, player.x + 14 - nx);
            for (const off of [-0.16, 0, 0.16])
              ebullets.push({ x: nx, y: ny, vx: Math.cos(pa + off) * 165, vy: Math.sin(pa + off) * 165 });
            S.eshoot();
          } else {
            boss.fireT = 1.6;
            for (let k = 0; k < 16; k++) {
              const a = k / 16 * 6.283 + boss.t;
              ebullets.push({ x: nx, y: ny, vx: Math.cos(a) * 100, vy: Math.sin(a) * 100 });
            }
            const pa = Math.atan2(player.y + 12 - ny, player.x + 14 - nx);
            ebullets.push({ x: nx, y: ny, vx: Math.cos(pa) * 190, vy: Math.sin(pa) * 190 });
            S.eshoot();
          }
        }
        if (inv <= 0 && shieldT <= 0 && aabb(player.x + 5, player.y + 5, 18, 15, boss.x + 6, boss.y + 6, boss.w - 12, boss.h - 12))
          damagePlayer();
      }
    }
  }

  /* 敌方子弹（含追踪导弹 + 擦弹判定） */
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    if (b.homing) {
      /* 导弹转向：有限角速度追踪玩家 */
      const px = player.x + 12, py = player.y + 10;
      const ca = Math.atan2(b.vy, b.vx);
      let ta = Math.atan2(py - b.y, px - b.x);
      let da = ta - ca;
      while (da > Math.PI) da -= 6.283;
      while (da < -Math.PI) da += 6.283;
      const turn = Math.max(-2.6 * dt, Math.min(2.6 * dt, da));
      const na = ca + turn;
      const sp = 130;
      b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) { ebullets.splice(i, 1); continue; }
    if (aabb(b.x - 2, b.y - 2, 5, 5, player.x + 6, player.y + 6, 17, 13)) {
      if (shieldT > 0) {
        parts.push({ x: b.x, y: b.y, vx: rnd(-40, 40), vy: rnd(-40, 40), life: 0.25, max: 1, col: COL.cy, sz: 2 });
        ebullets.splice(i, 1);
      } else if (inv <= 0) {
        ebullets.splice(i, 1);
        damagePlayer();
        break;
      }
    } else if (!b.grazed && inv <= 0) {
      /* 擦弹：贴身掠过（半径 18 内未命中） */
      const pd = Math.hypot(b.x - (player.x + 12), b.y - (player.y + 10));
      if (pd < 18) {
        b.grazed = true;
        grazeCnt++;
        stats.grazes++;
        if (stats.grazes >= 50) unlock('g50');
        saveStats();
        energy = Math.min(100, energy + 1.5);
        score += 5;
        addPop(b.x, b.y - 8, '擦弹!', COL.yl);
        S.graze();
        slowmoT = Math.max(slowmoT, 0.1);
      }
    }
  }

  /* 道具 */
  for (let i = pups.length - 1; i >= 0; i--) {
    const p = pups[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.t += dt;
    if (p.x < -16) { pups.splice(i, 1); continue; }
    if (aabb(p.x, p.y, 11, 11, player.x, player.y, 28, 24)) {
      pups.splice(i, 1);
      S.pick();
      if (p.type === 'spread') { spreadT = 12; addPop(p.x, p.y - 6, '散弹！', COL.yl); flash('255,230,0', 0.12); }
      else if (p.type === 'shield') { shieldT = 3; addPop(p.x, p.y - 6, '护盾！', COL.cy); flash('0,240,255', 0.12); }
      else {
        if (power < 3) { power++; addPop(p.x, p.y - 6, '火力提升！', COL.mg); flash('255,0,170', 0.12); }
        else { score += 500; addPop(p.x, p.y - 6, '+500', COL.mg); }
      }
      scorePulse = 1;
    }
  }

  /* 成就即时检查 */
  if (combo >= 30) unlock('c30');
  if (score >= 100000) unlock('s100k');
  if (stats.kills >= 50) unlock('k50');
  if (stats.kills >= 500) unlock('k500');
}
function killEnemy(idx, silentScore) {
  const e = enemies[idx];
  if (!e) return;
  enemies.splice(idx, 1);
  boomFx(e.x + e.w / 2, e.y + e.h / 2, e.type === 'small' || e.type === 'swarm' ? 16 : 30, e.type === 'med' || e.type === 'hunter');
  stats.kills++;
  saveStats();
  if (e.type === 'swarm') {
    /* 蜂群连锁：波及 34px 内其他敌人 */
    for (const o of enemies) {
      if (o.hp <= 0 || o.dead) continue;
      if (Math.hypot(o.x - e.x, o.y - e.y) < 34) {
        o.hp -= 3; o.flash = 0.08;
        if (o.hp <= 0) { o.dead = true; o.chainSilent = false; }
      }
    }
  }
  if (!silentScore) {
    combo++; comboT = 2.5;
    mult = 1 + Math.min(3, combo * 0.1);
    const pts = Math.round(e.pts * mult);
    score += pts;
    energy = Math.min(100, energy + 2);          /* 击杀充能 */
    scorePulse = 1;
    addPop(e.x + e.w / 2, e.y, '+' + pts, COL.wh);
    dropPup(e.x + e.w / 2, e.y + e.h / 2, false, e.elite ? 0.55 : 0.28);  /* 精英掉宝率翻倍 */
  }
  S.kill(combo);
  shake(e.type === 'small' || e.type === 'swarm' ? 2 : 4, 0.2);
}

  for (const b of ebullets) {

      ctx.fillStyle = 'rgba(34,255,136,0.3)';

function render() {
  const now = performance.now() / 1000;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  /* 屏幕震动：平滑衰减正弦 */
  if (shakeT > 0)
    ctx.translate(Math.sin(tGlobal * 70) * shakeMag * shakeT,
                  Math.cos(tGlobal * 57) * shakeMag * shakeT * 0.7);
  /* 慢动作变焦（Boss 击杀） */
  if (slowmoT > 0) {
    const z = 1 + 0.05 * Math.min(1, slowmoT);
    ctx.translate(W / 2, H / 2);
    ctx.scale(z, z);
    ctx.translate(-W / 2, -H / 2);
  }

  const off = Math.floor((tGlobal * 3) % W);
  ctx.globalAlpha = 0.85;
  ctx.drawImage(neb, -off, 0, W, H);
  ctx.drawImage(neb, W - off, 0, W, H);
  ctx.globalAlpha = 1;

  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(now * (1.5 + s.tw * 8) + s.ph);
    ctx.globalAlpha = s.li === 2 ? 0.5 + 0.5 * tw : tw;
    ctx.fillStyle = s.col;
    ctx.fillRect(s.x | 0, s.y | 0, s.sz, s.sz);
  }
  ctx.globalAlpha = 1;

  if (state === 'title') {
    drawTitle(now);
  } else {
    drawPups(now);
    for (const e of enemies) drawEnemy(e);
    if (boss) {
      drawSprite(SHIP_BOSS, boss.x, boss.y, 3, PAL);
      if (boss.flash > 0 || boss.dying > 0) {
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = COL.wh;
        for (let r = 0; r < SHIP_BOSS.length; r++) {
          const row = SHIP_BOSS[r];
          for (let c = 0; c < row.length; c++)
            if (PAL[row[c]]) ctx.fillRect(boss.x + c * 3, boss.y + r * 3, 3, 3);
        }
        ctx.restore();
      }
    }
    drawBullets();
    if (state === 'playing') drawPlayer(now);
    drawParts();
    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, p.life / 0.9);
      drawCText(p.txt, p.x, p.y - 6, 10, p.col, 'center');
      ctx.globalAlpha = 1;
    }
    drawHUD(now);
    if (state === 'playing' && isTouch) drawTouchUI(now);
    if (warnT > 0) {
      const a = 0.10 + 0.10 * Math.abs(Math.sin(now * 14));
      ctx.fillStyle = 'rgba(255,0,60,' + a.toFixed(3) + ')';
      ctx.fillRect(-8, -8, W + 16, H + 16);
      ctx.fillStyle = 'rgba(255,0,60,0.9)';
      for (let y = 20; y < H; y += 8) ctx.fillRect(-8, y, 30, 3);
      for (let y = 20; y < H; y += 8) ctx.fillRect(W - 22, y, 30, 3);
      if (Math.floor(now * 6) % 2 === 0) {
        drawCText('警 告 !', W / 2, H / 2 - 36, 24, COL.rd, 'center', COL.rd);
        drawCText('首脑逼近', W / 2, H / 2 + 6, 12, COL.wh, 'center');
      }
    }
    if (state === 'over') drawGameOver(now);
    drawAchToast();
  }
  ctx.restore();

  if (flashT > 0) {
    ctx.fillStyle = 'rgba(' + flashCol + ',' + (flashT * 3).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (paused && state === 'playing') {
    ctx.fillStyle = 'rgba(0,3,8,0.55)';
    ctx.fillRect(0, 0, W, H);
    drawCText('暂 停', W / 2, H / 2 - 16, 22, COL.cy, 'center', COL.cy);
    drawCText('点击右上角或按 P 键继续', W / 2, H / 2 + 16, 10, COL.gry, 'center');
  }

  if (muted) drawCText('静音', 8, H - 40, 9, COL.gry);
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(nowT) {
  requestAnimationFrame(loop);          /* 先排队下一帧，画面绝不冻结 */
  const dt = Math.min(0.033, (nowT - last) / 1000);
  last = nowT;
  try {
    const gdt = slowmoT > 0 ? dt * 0.35 : dt;   /* 慢动作（擦弹/Boss击杀） */
    if (slowmoT > 0) slowmoT -= dt;
    if (!paused) update(gdt);
    render();
  } catch (err) {
    console.error(err);
  }
}
requestAnimationFrame(loop);
})();
</script>
